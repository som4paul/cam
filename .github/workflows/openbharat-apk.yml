name: Build OpenBharat APK

on:
  push:
    branches:
      - openbharat-apk-build-20260807
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: openbharat-apk
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp openbharat-apk/app/build/outputs/apk/debug/app-debug.apk OpenBharat-Maps-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBharat-Maps-APK
          path: OpenBharat-Maps-v0.1-debug.apk
          retention-days: 30
